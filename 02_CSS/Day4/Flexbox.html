<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox in CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: black;">
    <h1 style="color: white;">FlexBox in CSS</h1>
    <p style="color: white;">FlexBox is a layout model in CSS that allows for the creation of flexible and responsive layouts. It provides a more efficient way to design, align, and distribute space among items in a container.</p>

    <div class="flex-container">
        <div class="box first">Item 1</div>
        <div class="box second">Item 2</div>
        <div class="box third">Item 3</div>
        <div class="box fourth">Item 4</div>
    </div>
</body>
</html>
