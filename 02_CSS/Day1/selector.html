<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector in CSS (Cascading Style Sheets)</title>

    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="selector.css">
</head>
<body>
    <h1>Selector in CSS (Cascading Style Sheets)</h1>
    <p>This is a paragraph.</p>
    <p class="highlight">This is a highlighted paragraph.</p>
    <p id="unique">This is a unique paragraph.</p>

    <h2>Types of Selectors</h2>
    <ul>
        <li>Element Selector</li>
        <li>Class Selector</li>
        <li>ID Selector</li>
        <li>Group Selector</li>
        <li>Descendant Selector</li>
    </ul>
</body>
</html>
