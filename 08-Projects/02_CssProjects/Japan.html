<!-- 
Golden Rule
Whenever you see any flag, ask yourself:
    What basic shapes do I see? (Rectangles, circles, triangles)
    Which is the largest shape? Create it first.
    Which shapes go inside it? Use position: absolute.
    Where should each shape go? Set top, left, right, or bottom.
    If shapes overlap, use z-index if needed. 
-->
