<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Calculator</title>
</head>
<body
    style="background-color: black; color: white; display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div id="parent">
        <h1>Love Calculator</h1>

        <form id="loveForm">
            <label for="boy">Boy Name: </label>
            <input type="text" id="boy" required>
            <br><br>
            <label for="girl">Girl Name: </label>
            <input type="text" id="girl" required>
            <br><br>
            <button type="submit">Calculate</button>
        </form>

        <h2 id="result">Result:</h2>
    </div>
<script src="script.js"></script>
</body>
</html>
