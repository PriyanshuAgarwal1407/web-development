<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Changer</title>
</head>
<body style="background-color: white;">
    <div id="color-container">
        <button id="red" style="background-color: red;">Change to Red</button>
        <button id="pink" style="background-color: pink;">Change to Pink</button>
        <button id="blue" style="background-color: blue;">Change to Blue</button>
        <button id="green" style="background-color: green;">Change to Green</button>
        <button id="yellow" style="background-color: yellow;">Change to Yellow</button>
        <button id="reset" style="background-color: white;">Reset</button>
    </div>
</body>
<script src="script.js"></script>
</html>
